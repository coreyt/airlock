version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Keep declared compatibility windows authoritative. Dependabot still refreshes
    # uv.lock for releases admitted by pyproject.toml, but must not widen a range
    # merely to make a major/API migration fit.
    versioning-strategy: increase-if-necessary
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Dependabot treats 0.x minor changes as non-major, but these are deliberate
      # API-migration boundaries and must not be widened automatically either.
      - dependency-name: fathomdb
        versions: [">=0.4"]
      - dependency-name: mistralai
        versions: [">=2"]
      - dependency-name: newscatcher-catchall-sdk
        versions: [">=2"]
      - dependency-name: textual
        # Textual 6.12+ requires Rich 14, while the validated LiteLLM 1.94.1
        # baseline requires Rich <14. Revisit after the LiteLLM migration.
        versions: [">=6.12"]
    groups:
      core-proxy:
        patterns:
          - litellm
          - presidio-*
          - fastapi
          - python-dotenv
          - pyyaml
          - sqlalchemy
          - prometheus-client
          - textual
      optional-integrations:
        patterns:
          - boto3
          - botocore
          - google-auth
          - google-genai
          - opentelemetry-*
          - tavily-python
          - mistralai
          - newscatcher-catchall-sdk
          - fathomdb
      developer-tooling:
        patterns:
          - pytest
          - pytest-*
          - mkdocs
          - mkdocs-*

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
