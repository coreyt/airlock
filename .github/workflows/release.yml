# Publish to PyPI when a version tag is pushed.
#
# Usage:
#   1. Bump version in pyproject.toml
#   2. Commit: git commit -am "Release 0.2.0"
#   3. Tag:    git tag v0.2.0
#   4. Push:   git push origin main --tags
#
# The workflow builds the package, runs tests, and publishes to PyPI
# using trusted publishing (no API tokens needed — configure the
# trusted publisher in PyPI project settings).
#
# PyPI trusted publisher setup (one-time):
#   Go to https://pypi.org/manage/project/airlock-llm/settings/publishing/
#   Add a new publisher:
#     - Owner: coreyt
#     - Repository: airlock
#     - Workflow: release.yml
#     - Environment: pypi

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a release after a tag has started publishing.
  cancel-in-progress: false

jobs:
  # Gate: run the full test suite before publishing
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Download spaCy model
        run: make ensure-spacy

      - name: Run tests
        run: uv run pytest --tb=short -q -m "not live and not docker"

      - name: Build strict documentation site
        run: uv run mkdocs build --strict --site-dir /tmp/airlock-docs

  # Gate: verify the tag matches every canonical Airlock version source.
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Verify tag and canonical Airlock versions
        run: python scripts/check-version-consistency.py --tag "${GITHUB_REF_NAME}"

  # Build sdist and wheel
  build:
    needs: [test, check-version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Build package
        run: |
          uv lock --check
          uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  # Publish to PyPI via trusted publishing
  publish:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    environment: pypi
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # Create a GitHub release with the built artifacts
  github-release:
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
